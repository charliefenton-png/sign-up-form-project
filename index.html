<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
 <div id="container">
  <div id="images">
   <img class="background" src="sign-up-images/sign-up-background.jpg" alt="autumn leaves">
    <div class="logoBack">
     <img class="logo" src="sign-up-images/sign-up-logo.png" alt="logo of Odin" width="130" height="150">
     <p class="odin">Odin</p>
    </div> 
    </div>
   <div class="right"> 
    <h1>This is not a real online service! You know you need something in your life like this to help
        you realize your deepest dreams. Sign up <i>now</i> to get started.    
    </h1>
    <h2>You know <i>you</i> want to.</h2>
    <h3>Let's  do this!</h3>
    <form action="" method="">
     <div class="columns">
      <div class="rightColumn">
       <label class="first" for="first_name">First Name:</label>
       <input type="text" name="first_name" id="first_name">
       <label class="email" for="user_email">Email Address:</label>
       <input type="email" id="user_email" name="email" placeholder="you@example.com">
       <label for="user_password">Password:</label>
       <input type="password" id="user_password" name="password">
      </div>
      <div class="leftColumn">
       <label for="last_name">Last Name:</label>
       <input type="text" name="last_name" id="last_name">
       <label for="phone">Enter your phone number:</label>
       <input type="tel" id="phone" name="phone" pattern="[0-9]{3}-[0-9]{2}-[0-9]{3}">
       <label for="confirm_user_password">Confirm Password:</label>
       <input type="password" id="confirm_user_password" name="confirm_password">
      </div>
     </div>
  </div>


</div>    
</body>
</html>
